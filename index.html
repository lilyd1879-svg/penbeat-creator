<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>펜비트 창작지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3; --panel:#ffffff; --text:#1b2430; --muted:#5d6b7c; --border:#d3d9e0;
  --accent:#0f5f73; --accent-ink:#ffffff; --seg:#e3e8ee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14181d;--panel:#1d232a;--text:#e6eaf0;--muted:#9aa7b6;--border:#323b45;--accent:#5fb7cc;--accent-ink:#06222b;--seg:#2a323b}
}
:root[data-theme="dark"]{--bg:#14181d;--panel:#1d232a;--text:#e6eaf0;--muted:#9aa7b6;--border:#323b45;--accent:#5fb7cc;--accent-ink:#06222b;--seg:#2a323b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

/* ---------- app chrome ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--border)}
.bar-in{max-width:none;margin:0;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar-in + .bar-in{border-top:1px solid var(--border)}
#condRow{border-top:0 !important;padding-top:12px;padding-bottom:18px}
.brand{font-weight:800;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{border:1px solid var(--border);background:transparent;color:var(--text);padding:7px 14px;border-radius:8px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tab[aria-selected="true"]{background:var(--td,#ccc);color:#111;border-color:transparent;font-weight:800}
#btnHome{background:var(--text);border-color:var(--text);color:var(--panel);font-weight:700}
#btnHome:hover{border-color:var(--text);opacity:.85}
.bar-in.top{justify-content:flex-start;padding-top:18px;padding-bottom:12px}
#btnHome{order:9;margin-left:auto}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.4);flex:none}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zoomg{margin-right:16px}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--panel);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.6;cursor:progress}
.hint{font-size:12.5px;color:var(--muted)}
.zoomg{gap:4px}
.zb{width:34px;padding:7px 0;text-align:center;font-weight:700}
#toolRow{padding-top:13px;padding-bottom:17px}
#editActions .btn{height:32px;padding:0 12px;font-size:13px;box-sizing:border-box}
#editActions .zb{width:30px;padding:0}
.zv{border:2px solid var(--text);min-width:52px;padding:0 4px !important;text-align:center;font-variant-numeric:tabular-nums}
#condText{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 34px}
#condText .ch0{font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
[hidden]{display:none !important}

#stage{max-width:none;margin:0;padding:12px 8px 8px;overflow-x:clip}
#wrap{width:1040px;margin:0 auto}
#wrap .sheet{box-shadow:0 1px 3px rgba(0,0,0,.18),0 10px 28px rgba(0,0,0,.10)}
.foot{max-width:none;margin:0;padding:6px 16px 36px;font-size:12.5px;color:var(--muted)}
#dlg{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg-card{background:var(--panel);color:var(--text);border-radius:16px;padding:24px;width:min(100%,440px);box-shadow:0 12px 40px rgba(0,0,0,.28)}
.dlg-card h2{margin:0 0 12px;font-size:18px;line-height:1.4}
.dlg-chip{display:inline-block;max-width:100%;padding:7px 12px;background:var(--seg);border-radius:8px;font-size:14px;overflow-wrap:anywhere;margin-bottom:12px}
.dlg-card p{margin:0 0 20px;font-size:13.5px;color:var(--muted)}
.dlg-act{display:flex;justify-content:flex-end;gap:10px}
.dlg-act .btn{padding:9px 20px;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,520px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* ---------- home ---------- */
#home{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:28px 20px}

.home-card{width:min(100%,820px);display:flex;flex-direction:column;align-items:center;gap:28px;padding:34px clamp(18px,4vw,40px) 38px;border-radius:28px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 36px rgba(40,25,5,.22)}
#home h1{margin:0;font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:clamp(36px,7vw,58px);font-weight:400;letter-spacing:-.01em;text-align:center}
.home-btns{display:flex;flex-direction:column;gap:18px;align-items:stretch;width:100%}
.home-btn{flex:none;min-height:120px;border:2px solid var(--text);border-radius:18px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400;font-size:clamp(28px,4.8vw,36px);transition:transform .12s,background .12s}
.home-btn small{font-size:15px;font-weight:400;color:var(--muted);text-align:center;line-height:1.5;padding:0 10px;white-space:nowrap}
.home-btn .fin{color:#b03a3a}
.home-btn:hover{transform:translateY(-2px);background:var(--seg)}
.home-btn:focus-visible{outline:3px solid #2563eb;outline-offset:3px}

/* ---------- worksheet (paper) ---------- */
.sheet{width:1040px;height:718px;overflow:hidden;background:#fff;color:#111;border:0;padding:16px 22px 12px;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.35;text-align:left}
.sc{--cw:15px;--gap:22px;width:calc(var(--cw)*64 + var(--gap)*3);transform-origin:0 0}
.sh{display:flex;align-items:flex-start;gap:14px}
.prog{flex:none;white-space:nowrap;width:calc(138px*var(--hk,1));font-size:calc(13px*var(--hk,1));font-weight:700;color:#111;padding-top:calc(8px*var(--hk,1))}
.ttl{flex:none;text-align:left;align-self:flex-end}
.ttr{display:flex;align-items:baseline;justify-content:center;gap:calc(10px*var(--hk,1))}
.ttl h1{margin:0;font-size:calc(28px*var(--hk,1));font-weight:800;letter-spacing:-.01em;line-height:1.2}
.tempo{font-size:calc(14px*var(--hk,1));white-space:nowrap}
.rt{flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.who{flex:none;justify-content:flex-end;display:flex;gap:16px;align-items:flex-end;padding-top:6px}
.who .f{display:flex;align-items:flex-end;gap:calc(6px*var(--hk,1));font-size:calc(13px*var(--hk,1));font-weight:700}
.who input,.who .v{text-align:center;width:calc(92px*var(--hk,1));height:calc(26px*var(--hk,1));border:0;border-bottom:1px solid #8a8a8a;border-radius:0;background:#eeeeee;color:#111;font:inherit;font-size:calc(15px*var(--hk,1));font-weight:500;padding:0 4px;display:inline-block;line-height:calc(24px*var(--hk,1))}
.cond{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin:8px 0 2px;font-size:11.5px}
.lg{display:flex;gap:calc(12px*var(--hk,1));white-space:nowrap;font-weight:400;margin-top:calc(8px*var(--hk,1));font-size:calc(9.5px*var(--hk,1));color:#111}
.lg span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:var(--cw);height:26px;box-sizing:border-box;border:1px solid #8a8a8a;flex:none}
.sw.d{background:var(--dark)}.sw.l{background:var(--light)}.sw.w{background:#fff}
.lg .pair{display:flex}.lg .pair .sw+.sw{border-left:0}
.sec{display:flex;align-items:flex-start;gap:10px;margin:44px 0 8px}
.tag{background:#d9d9d9;border:1px solid #888;font-weight:700;font-size:13px;padding:3px 10px;white-space:nowrap}
.nl{font-size:13px;padding-top:4px;white-space:nowrap}
.note{flex:1;min-height:20px;line-height:19px;font-size:13px;white-space:nowrap;overflow:hidden;border-bottom:1px solid #8a8a8a;background:#eeeeee;padding:0 6px;overflow-wrap:anywhere;font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.note input{display:block;width:100%;height:19px;margin:0;padding:0;border:0;background:transparent;color:#111;font:inherit;font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:19px}
.row{margin-bottom:8px;width:calc(var(--cw)*64 + var(--gap)*3)}
.hd{display:flex;align-items:flex-end;min-height:28px}
.mh{width:calc(var(--cw)*16);margin-right:var(--gap);flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:2px 3px;font-size:9px;line-height:1.15;min-height:28px}
.mh .l1{font-weight:400}
.mh .l2{color:#666}
.mh{position:relative}
.fi{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#0b3d91;font-weight:700;font-size:10px;pointer-events:none}
.gd{display:flex}
.m{position:relative;display:flex;width:calc(var(--cw)*16);margin-right:var(--gap);flex:none;border:1px solid #000}
.c{display:block;flex:1 1 0;min-width:0;height:26px;margin:0;padding:0;appearance:none;-webkit-appearance:none;border:0;border-left:1px solid #d4d4d4;border-radius:0;background:#fff;position:relative;text-align:center;font:700 12px/24px 'Noto Sans KR',sans-serif;color:#111;cursor:text;overflow:hidden;white-space:nowrap}
.c.e,.c.p0{background:var(--light)}
.c.p0{border-left:0}
.c.q{border-left:1px solid #000}
.c.h{border-left:1px dotted #000}
.c.sel{background:#cfe0ff !important;box-shadow:inset 0 0 0 1px #5b8def}
.mh{cursor:pointer}
.sheet.selecting,.sheet.selecting *{user-select:none;-webkit-user-select:none}
.ph{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:#e11d48;border-radius:2px;box-shadow:0 0 6px rgba(225,29,72,.6);pointer-events:none;z-index:4}
.pos{display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap;margin-left:6px}
.pl{font-weight:800;font-size:14px;white-space:nowrap}
.pos input{width:48px;height:32px;box-sizing:border-box;padding:0 4px;font-size:14px;border:2px solid var(--text);border-radius:8px;text-align:center;font:inherit;background:var(--panel);color:var(--text)}
.ib{width:38px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.spd{display:flex;align-items:center;gap:10px;margin-left:12px}
.spd-r{width:160px;height:32px;padding:0 8px;position:relative;display:flex;align-items:center}
.spd-r input{width:100%;margin:0;accent-color:var(--accent)}
.spd-t{position:absolute;left:8px;right:8px;top:26px;height:14px}
.spd-t span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.spd b{min-width:62px;height:32px;font-size:13px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;margin:0;padding:0 10px;border-radius:9px;background:var(--seg);text-align:center;font-variant-numeric:tabular-nums}
.fw{flex:none;background:#c9daf8;padding:0 6px 6px;margin:0 calc(var(--gap) - 6px) -6px -6px}
.fw .m{margin-right:0}
.mh.fill{background:#c9daf8;width:calc(var(--cw)*16 + 12px);margin-left:-6px;margin-right:calc(var(--gap) - 6px);padding-left:9px;padding-right:9px}
.c:focus-visible{outline:2px solid #2563eb;outline-offset:-2px;z-index:1}
.ly,.pk{position:relative;height:20px;width:calc(var(--cw)*64 + var(--gap)*3)}
.ch{position:absolute;top:2px;font-size:var(--lf,13px);line-height:17px;text-align:center;white-space:nowrap}
.ch.w{font-size:calc(var(--lf,13px)*.81);letter-spacing:-.04em}
.pkl{position:absolute;left:0;top:3px;font-size:11px;font-weight:700;color:#444;text-align:right;white-space:nowrap}
.sft{flex:1;min-width:0;align-self:flex-end;text-align:left;margin:0 0 5px 6px;font-size:calc(11px*var(--hk,1));line-height:1.35;color:#666}
.sft a{color:#666;overflow-wrap:anywhere}
.sft>div{padding:0}
.sft .rg{margin-left:12px;white-space:nowrap;background:var(--light);color:#333;padding:1px 6px}

/* ---------- audio & sync bar ---------- */
#audioRow{padding-top:8px;padding-bottom:8px;gap:8px 10px;flex-wrap:wrap;font-size:13px}
#audioRow .btn{height:30px;padding:0 10px;font-size:12px}
#audioRow .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.aud-file{display:inline-flex;align-items:center;gap:6px}
.aud-name{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.aud-seek{display:flex;align-items:center;gap:6px;flex:1 1 200px;min-width:170px;max-width:340px}
.aud-seek input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
.aud-time{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:74px;text-align:center}
.aud-vol{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.aud-vol input[type=range]{width:68px;accent-color:var(--accent)}
.sync-box{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.sync-box input[type=number]{width:58px;height:30px;box-sizing:border-box;padding:0 4px;border:1.5px solid var(--border);border-radius:7px;text-align:center;font:inherit;background:var(--panel);color:var(--text)}
.sync-box .btn.sm{height:30px;padding:0 7px;font-size:12px}
#ytWrap{position:fixed;right:14px;bottom:14px;z-index:20;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;width:248px}
#ytWrap.off{position:fixed;left:-9999px;top:-9999px;right:auto;bottom:auto;opacity:.01;pointer-events:none}
#ytHead{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;font-size:11px;font-weight:700;background:var(--seg);color:var(--text)}
#ytHead button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:0 4px}
#ytPlayer{width:248px;height:140px;display:block}
@media print{#ytWrap{display:none !important}}

/* ---------- print ---------- */
#printRoot{position:fixed;left:-12000px;top:0;width:1085px;z-index:-1;pointer-events:none}
#printRoot:empty{display:none}
#printRoot .pp{width:1085px;height:754px;background:#fff}
#printRoot .psvg{display:block;width:100%;height:100%}
#printRoot .sheet{width:1085px;height:754px;padding:8px 10px 6px 10px}
/* ---------- 모바일 : 상단 도구는 스크롤과 함께 올라가고, 재생 줄만 위에 고정 → 키보드가 떠도 악보가 보임 ---------- */
@media (max-width:760px), (max-height:520px){
  .bar{position:static;display:contents}
  .bar-in{background:var(--panel);border-bottom:1px solid var(--border)}
  .bar-in + .bar-in{border-top:0}
  #toolRow{display:contents}
  #playBar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding:6px 10px;gap:6px 6px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  #playBar .pl{display:none}
  #editActions{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
  .spacer{display:none}
  .ib{width:36px;height:32px}
  .pos{margin-left:0;font-size:13px}
  .pos input{width:46px;height:32px;padding:0 4px}
  .spd{margin-left:4px;gap:8px}
  .spd-r{width:120px;height:32px}
  .spd-t{top:25px}
  .spd-t span{font-size:10px}
  .spd b{min-width:54px;height:32px;font-size:12px;padding:0 6px}
  .zoomg{margin-right:0}
  #audioRow{padding:8px 10px;gap:6px}
  .aud-seek{flex:1 1 100%;max-width:none}
}
@media (max-width:560px){.home-card{padding:28px 12px 30px}.home-btn small{white-space:normal;font-size:12px;padding:0 4px}}
@media print{
  @page{size:A4 landscape;margin:5.5mm 5mm 5mm 5mm}
  :root{padding:0}
  html,body{background:#fff !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #app,#home,#dlg,#toast{display:none !important}
  #printRoot{position:static;width:auto;z-index:auto;display:block}
  #printRoot .pp{width:100vw;height:99vh;margin:0;overflow:hidden;break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always}
  #printRoot .pp:last-child{break-after:auto;page-break-after:auto}
  .sheet{box-shadow:none !important}
}
</style>
</head>
<body>
<div id="home" hidden>
  <div class="home-card">
  <h1>음악 펜비트 창작지</h1>
  <div class="home-btns">
    <button type="button" class="home-btn" data-session="3">3차시<small id="sub3"></small></button>
    <button type="button" class="home-btn" data-session="4"><span>4차시 <span class="fin">(최종)</span></span><small id="sub4"></small></button>
  </div>
  </div>
</div>
<div id="app" hidden>
  <header class="bar">
    <div class="bar-in top">
      <button type="button" class="btn" id="btnHome">홈으로</button>
      <div class="brand">펜비트 창작지</div>
      <div class="tabs" id="tabs" role="tablist" aria-label="곡 선택"></div>
    </div>
    <div class="bar-in" id="condRow">
      <span class="hint" id="condText"></span>
    </div>
    <div class="bar-in" id="toolRow">
      <div class="group" id="playBar">
        <span class="pl">재생</span>
        <button type="button" class="btn primary ib" id="btnPlay"></button>
        <button type="button" class="btn primary ib" id="btnRestart" aria-label="처음부터 재생" title="처음부터 재생"></button>
        <label class="pos"><input type="number" id="posM" min="1" step="1" value="1" inputmode="numeric" aria-label="재생 위치 마디"> 마디부터</label>
        <div class="spd">
          <span class="pl">빠르기</span>
          <div class="spd-r">
            <input type="range" id="spd" min="50" max="150" step="25" value="100" aria-label="재생 빠르기">
            <div class="spd-t" aria-hidden="true"><span style="left:0">0.5</span><span style="left:25%">0.75</span><span style="left:50%">1.0</span><span style="left:75%">1.25</span><span style="left:100%">1.5</span></div>
          </div>
          <b id="spdV">♩ = 0</b>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="group" id="editActions">
        <div class="group zoomg" role="group" aria-label="화면 확대/축소">
          <button type="button" class="btn zb" id="zOut" aria-label="축소">−</button>
          <button type="button" class="btn zv" id="zFit" aria-label="100%로 되돌리기" title="누르면 100%로 돌아가요">100%</button>
          <button type="button" class="btn zb" id="zIn" aria-label="확대">＋</button>
          <button type="button" class="btn" id="zW" title="화면 가로 폭에 맞춰요">폭 맞춤</button>
        </div>
        <input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>
        <button type="button" class="btn" id="btnLoadPdf" title="저장한 PDF 파일을 불러와 악보를 복원해요">PDF 불러오기</button>
        <button type="button" class="btn" id="btnClear">초기화</button>
        <button type="button" class="btn primary" id="btnSave">저장</button>
        <button type="button" class="btn primary" id="btnPrint">PDF 다운로드</button>
        <button type="button" class="btn" id="btnPrintMode">인쇄</button>
      </div>
    </div>
    <div class="bar-in" id="audioRow">
      <button type="button" class="btn on" id="btnYt" aria-pressed="true" title="곡의 유튜브 링크를 반주로 재생해요">유튜브 ON</button>
      <button type="button" class="btn" id="btnYtWin" title="유튜브 미니 플레이어 창 보이기/숨기기">영상 숨기기</button>
      <span class="aud-name" id="audName">유튜브 반주 연결 중...</span>
      <button type="button" class="btn" id="btnAudPreview" disabled title="노래만 들으면서 1마디 시작 위치를 찾아요">노래만 듣기</button>
      <div class="aud-seek">
        <input type="range" id="audSeek" min="0" max="100" step="0.05" value="0" disabled aria-label="노래 탐색">
        <span class="aud-time" id="audTime">0:00 / 0:00</span>
      </div>
      <label class="aud-vol">볼륨 <input type="range" id="audVol" min="0" max="100" step="5" value="80" aria-label="노래 볼륨"></label>
      <button type="button" class="btn" id="btnMet" aria-pressed="false" title="4/4박자 메트로놈 클릭음">메트로놈 OFF</button>
      <div class="sync-box" title="노래에서 1마디가 시작하는 시간(초)">
        <span>1마디(초)</span>
        <button type="button" class="btn sm" id="btnSyncMinus">−0.05</button>
        <input type="number" id="syncSec" step="0.05" value="0" aria-label="1마디 시작 시간(초)">
        <button type="button" class="btn sm" id="btnSyncPlus">+0.05</button>
        <button type="button" class="btn sm primary" id="btnSyncNow" disabled title="현재 노래 재생 위치를 1마디 시작으로 설정">현재 위치를 1마디로</button>
      </div>
    </div>
  </header>
  <main id="stage"><div id="wrap"></div></main>
  <p class="foot" id="foot"></p>
</div>
<div id="dlg" hidden>
  <div class="dlg-card" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <div class="dlg-chip" id="dlgChip"></div>
    <p id="dlgMsg"></p>
    <div class="dlg-act">
      <button type="button" class="btn" id="dlgNo">취소</button>
      <button type="button" class="btn primary" id="dlgYes">확인</button>
    </div>
  </div>
</div>
<div id="printRoot" aria-hidden="true"></div>
<div id="ytWrap" class="off" hidden>
  <div id="ytHead"><span>유튜브 반주</span><button type="button" id="btnYtHide" title="창 숨기기">✕</button></div>

</div>

const KEY = 'penbeat-worksheets-v4';

let storageOK = true;
/* 작성 중인 내용은 화면(메모리)에만 있고, "저장하기"를 눌러야 브라우저에 남는다 */
function readSaved(){
  try{
    const j = localStorage.getItem(KEY);
    if(j){
      const d = JSON.parse(j), i = d.info || {};
      return { info:{no:String(i.no||''), name:String(i.name||'')}, songs:(d.songs && typeof d.songs==='object') ? d.songs : {} };
    }
  }catch(e){ storageOK = false; }
  return { info:{no:'',name:''}, songs:{} };
}
function revertToSaved(){ const d = readSaved(); S.songs = d.songs; }
function save(){ /* 입력 중에는 저장하지 않음 (저장하기 버튼에서만 저장) */ }
function commitSave(){
  try{ localStorage.setItem(KEY, JSON.stringify({songs:S.songs})); return true; }
  catch(e){ storageOK = false; return false; }
}
/* 예전 버전이 남긴 자동 저장 데이터 삭제 (저장하기로 저장한 v3만 사용) */

revertToSaved();
function infoOf(id){ const o = stateOf(id); const i = o.info || (o.info = {no:'', name:''}); if(typeof i.no!=='string') i.no=''; if(typeof i.name!=='string') i.name=''; return i; }
function stateOf(id){
  const o = S.songs[id] || (S.songs[id] = {cells:{}, notes:{}});
  if(!o.cells) o.cells = {};
  if(!o.notes) o.notes = {};

}

const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
const CELL = 15, MW = CELL*16, MGAP = 14;
const xOf = slot => Math.floor(slot/17)*(MW+MGAP) + (slot%17)*CELL;
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 3600);
}

/* ================= 활동지 그리기 ================= */
function addLyr(box, str){
  str.trim().split(/\s+/).forEach(tok=>{
    const i = tok.indexOf(':'); const slot = +tok.slice(0,i); const txt = tok.slice(i+1);
    const n = txt.length; const k = Math.floor(slot/17), pp = slot%17;
    const s = el('span','ch'+(n>1?' w':''), txt);
    s.style.width = 'calc(var(--cw)*'+n+')'; s.style.left = 'calc(var(--cw)*'+(k*16+pp-(n-1)/2)+' + var(--gap)*'+k+')';
    box.append(s);
  });
}

function buildRow(row, ri, o){
  const r = el('div','row');
  if(row.pick){
    const pk = el('div','pk');
    const lab = el('span','pkl',row.pick.label); lab.style.width = 'calc(var(--cw)*'+(3*16+12)+' + var(--gap)*3 - 4px)';
    pk.append(lab); addLyr(pk,row.pick.ly); r.append(pk);
  }
  const hd = el('div','hd');
  row.m.forEach((lb,k)=>{
    const isFill = (row.fill||[]).includes(k);
    const h = el('div','mh'+(isFill?' fill':''));
    const l = el('div','lb');
    lb.split('/').forEach((x,i)=>l.append(el('div',i?'l2':'l1',x)));
    h.append(l);
    if(isFill) h.append(el('span','fi','필인(Fill-in) 구간'));
    hd.append(h);
  });
  r.append(hd);
  const gd = el('div','gd');
  row.m.forEach((lb,k)=>{
    const isFill = (row.fill||[]).includes(k);
    const m = el('div','m');
    for(let p=0;p<16;p++){
      const key = ri+'.'+k+'.'+p;
      const v = String((o.st && o.st.cells[key]) || '').slice(0,1);
      let cls = 'c' + (p===0?' p0':(p%2===0?' e':'')) + (p%4===0&&p>0?' q':'') + (p%4===2?' h':'');
      let c;
      if(o.edit){
        c = el('input',cls); c.type='text'; c.maxLength=1; c.value=v; c.autocomplete='off';
        c.setAttribute('autocapitalize','characters'); c.spellcheck=false;
        c.setAttribute('aria-label', lb.split('/')[0]+' '+(p+1)+'번째 칸 ('+(p%2===0?'8비트':'16비트')+')');
      } else { c = el('div',cls,v); }
      c.dataset.k = key;
      m.append(c);
    }
    if(isFill){ const fw = el('div','fw'); fw.append(m); gd.append(fw); }
    else gd.append(m);
  });
  r.append(gd);
  row.ly.forEach(s=>{ const ly=el('div','ly'); addLyr(ly,s); r.append(ly); });
  return r;
}

function buildSheet(song, o){
  const sh = el('div','sheet');
  sh.style.setProperty('--dark', song.dark); sh.style.setProperty('--light', song.light);
  sh.dataset.song = song.id;

  const hd = el('div','sh');
  const prog = el('div','prog','[음악] 펜비트 창작지'); hd.append(prog);
  const t = el('div','ttl'); const tr = el('div','ttr'); tr.append(el('h1','',song.title)); tr.append(el('span','tempo','( ♩= '+song.tempo+' )')); t.append(tr); hd.append(t);
  const who = el('div','who');
  [['no','학번 :'],['name','이름 :']].forEach(([k,lab])=>{
    const f = el('label','f'); f.append(el('span','',lab));
    if(o.edit){
      const i = el('input'); i.type='text'; i.value = infoOf(S.cur)[k]||''; i.dataset.info=k; i.maxLength=16; i.autocomplete='off';
      f.append(i);
    } else {
      f.append(el('span','v', (o.info && o.info[k]) || ''));
    }
    who.append(f);
  });
  const rt = el('div','rt'); rt.append(who); hd.append(rt); sh.append(hd);

    const lg = el('div','lg');
  lg.innerHTML = '<span><i class="sw l"></i>: 8비트</span><span><i class="sw w"></i>: 16비트</span>';
  prog.append(lg);

  let ri = 0;
  song.secs.forEach((sec,si)=>{
    const s = el('div','sec');
    s.append(el('div','tag',sec.name)); s.append(el('div','nl','리듬 설명 :'));
    const nt = el('div','note');
    if(o.edit){
      const ta = el('input'); ta.type='text'; ta.value = o.st.notes[si]||''; ta.dataset.note=si;
      ta.setAttribute('aria-label', sec.name+' 리듬 설명');
      nt.append(ta);
    } else { nt.textContent = (o.st && o.st.notes[si]) || ''; }
    s.append(nt); sh.append(s);
    sec.rows.forEach(row=>{ sh.append(buildRow(row, ri, o)); ri++; });
  });

  const ft = el('div','sft');
  const left = el('div','');
  left.append(document.createTextNode('참고 영상: '));
  const a = el('a','',song.link.trim()); a.href = song.link.trim(); a.target='_blank'; a.rel='noopener noreferrer';
  left.append(a);
  const rg = el('span','rg',song.range); left.append(rg); ft.append(left);
  hd.insertBefore(ft, rt);
  const sc = el('div','sc'); while(sh.firstChild) sc.append(sh.firstChild); sh.append(sc);
  return sh;
}

/* ================= 작성 동작 ================= */
function attachEdit(sh, song){
  const st = stateOf(song.id);
  const rows = $$('.gd', sh).map(g=>$$('.c', g));
  const all = rows.flat();
  const hdrs = $$('.mh', sh);
  /* ---- 여러 칸 선택 · 복사 · 붙여넣기 (구글 시트처럼) ---- */
  let sel = null;                     /* {a:기준칸, b:끝칸} (칸 번호) */
  const norm = v => String(v).toUpperCase().replace(/\s+/g,'').slice(0,1);
  const range = () => { if(!sel) return null; const lo = Math.min(sel.a,sel.b), hi = Math.max(sel.a,sel.b); return lo===hi ? null : [lo,hi]; };
  const paint = () => { const r = range(); all.forEach((c,i)=>c.classList.toggle('sel', !!r && i>=r[0] && i<=r[1])); };
  const setSel = (a,b) => { sel = {a,b}; paint(); };
  const clearSel = () => { if(sel){ sel = null; paint(); } };
  const setCell = (c,v) => { c.value = v; if(v) st.cells[c.dataset.k] = v; else delete st.cells[c.dataset.k]; };
  const selText = r => { const L = []; for(let i=r[0]; i<=r[1]; i++){ const m = Math.floor(i/16); (L[m] || (L[m] = [])).push(all[i].value); } return L.filter(Boolean).map(a=>a.join('\t')).join('\n'); };
  const clearCells = r => { for(let i=r[0]; i<=r[1]; i++) setCell(all[i], ''); };
  let dragA = -1;
  sh.addEventListener('mousedown', e=>{
    const hd = e.target.closest && e.target.closest('.mh');
    if(hd){ const mi = hdrs.indexOf(hd); if(mi>=0 && all[mi*16]){ setSel(mi*16, mi*16+15); all[mi*16].focus({preventScroll:true}); e.preventDefault(); } return; }
    const c = e.target; if(!c.classList || !c.classList.contains('c')) return;
    const i = all.indexOf(c);
    if(e.shiftKey){
      const a = sel ? sel.a : all.indexOf(document.activeElement);
      if(a>=0){ setSel(a, i); e.preventDefault(); return; }
    }
    clearSel(); dragA = i;
  });
  sh.addEventListener('mousemove', e=>{
    if(dragA<0 || e.buttons!==1) return;
    const t = document.elementFromPoint(e.clientX, e.clientY); const j = all.indexOf(t);
    if(j<0 || (j===dragA && !sel)) return;
    setSel(dragA, j); sh.classList.add('selecting');
    const g = window.getSelection && window.getSelection(); if(g) g.removeAllRanges();
  });
  document.addEventListener('mouseup', ()=>{ dragA = -1; sh.classList.remove('selecting'); });
  sh.addEventListener('copy', e=>{ const r = range(); if(!r) return; e.preventDefault(); e.clipboardData.setData('text/plain', selText(r)); });
  sh.addEventListener('cut', e=>{ const r = range(); if(!r) return; e.preventDefault(); e.clipboardData.setData('text/plain', selText(r)); clearCells(r); });
  sh.addEventListener('paste', e=>{
    const tgt = e.target;
    if(!tgt || !tgt.classList || !tgt.classList.contains('c')) return;
    const cd = e.clipboardData || window.clipboardData; if(!cd) return;
    const raw = cd.getData('text') || ''; const r = range();
    const start = r ? r[0] : all.indexOf(tgt); if(start<0) return;
    const normBeat = t => {
      const s = String(t||'').trim().toUpperCase();
      if(!s || /^[-._0X]+$/.test(s)) return '';
      const m = s.match(/[ABC]/);
      return m ? m[0] : '';
    };
    const cleaned = raw.replace(/\r/g,'').replace(/\d+\s*마디/g,' ');
    if(cleaned.indexOf('\t') >= 0){
      const lines = cleaned.replace(/\n+$/,'').split('\n').map(l=>l.split('\t'));
      const multi = lines.length>1 || lines[0].length>1;
      e.preventDefault();
      if(!multi){ const v = normBeat(lines[0][0]); for(let i=(r?r[0]:start); i<=(r?r[1]:start); i++) setCell(all[i], v); save(); return; }
      const m0 = Math.floor(start/16), p0 = start%16; let last = start;
      lines.forEach((ln,li)=>ln.forEach((tok,ti)=>{
        const p = p0+ti; if(p>15) return;
        const idx = (m0+li)*16+p; if(!all[idx]) return;
        setCell(all[idx], normBeat(tok)); if(idx>last) last = idx;
      }));
      setSel(start, last); save(); return;
    }
    const rawToks = cleaned.trim().split(/[\s,|/]+/).filter(Boolean);
    const toks = [];
    rawToks.forEach(t=>{
      if(/^[ABCabc\-._0xX]{2,}$/.test(t)){
        t.split('').forEach(ch=>toks.push(normBeat(ch)));
      } else {
        toks.push(normBeat(t));
      }
    });
    if(toks.length <= 1 && !r) return;
    e.preventDefault();
    if(toks.length <= 1 && r){
      const v = toks[0] || '';
      for(let i=r[0]; i<=r[1]; i++) setCell(all[i], v);
      save(); return;
    }
    let last = start;
    toks.forEach((v, k)=>{
      const idx = start + k; if(!all[idx]) return;
      setCell(all[idx], v); last = idx;
    });
    setSel(start, last); save();
  });
  sh.addEventListener('input', e=>{
    const t = e.target;
    clearSel();
    if(t.classList.contains('c')){
      const v = t.value.toUpperCase().replace(/\s+/g,'');
      if(v!==t.value) t.value = v;
      if(v) st.cells[t.dataset.k] = v; else delete st.cells[t.dataset.k];
      save();
    } else if(t.dataset.info){ infoOf(S.cur)[t.dataset.info] = t.value; save(); }
    else if(t.dataset.note!=null){ st.notes[t.dataset.note] = t.value; save(); }
  });
  sh.addEventListener('focusin', e=>{
    const c = e.target; if(!c.classList.contains('c')) return;
    c.select();
    const vv = window.visualViewport;

function computeScale(sh){
  const sc = sh.firstElementChild; if(!sc) return 1;
  sc.style.transform = ''; sc.style.setProperty('--cw','15px');
  const cs = getComputedStyle(sh);
  const avail = sh.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const innerW = sh.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const GAP = 22;
  const h = sc.offsetHeight;
  const s = Math.min(1, avail/h);
  /* 가로: 줄어든 비율만큼 칸을 넓혀서, 좌우 여백이 같고 가로가 꽉 차게 한다 */
  sc.style.setProperty('--cw', (((innerW/s) - GAP*3)/64)+'px');
  if(s<1) sc.style.transform = 'scale('+s+')';
  return s;
}
let refScale = 0;
function getRefScale(){            /* '나는 나비' 활동지의 축소 비율 → 가사 글자 크기 기준 */

}
function fitSheet(sh){

  sc.style.setProperty('--hk','1');

  for(let i=0;i<2;i++){ sc.style.setProperty('--hk', ref/s); s = computeScale(sh); }
  sc.style.setProperty('--hk', ref/s);
  sc.style.setProperty('--lf', (13*ref/s)+'px');
}

function parseEmbeddedPdfData(buf){
  try{
    const txt = new TextDecoder('latin1').decode(new Uint8Array(buf));
    const idx = txt.indexOf('PENBEAT_DATA:');
    if(idx < 0) return null;
    const start = txt.indexOf('{', idx);
    if(start < 0) return null;
    let depth = 0, inStr = false, esc = false, end = -1;
    for(let i=start; i<txt.length && i<start+60000; i++){
      const ch = txt[i];
      if(esc){ esc = false; continue; }
      if(ch === '\\'){ esc = true; continue; }
      if(ch === '"'){ inStr = !inStr; continue; }
      if(inStr) continue;
      if(ch === '{') depth++;
      else if(ch === '}'){ depth--; if(depth===0){ end = i+1; break; } }
    }
    if(end < 0) return null;
    const utf = new TextDecoder('utf-8').decode(new Uint8Array(buf.slice(start, end)));
    return JSON.parse(utf);
  }catch(e){ return null; }
}
function makeCharTemplates(){
  const W = 16, H = 20, out = {};
  const cv = document.createElement('canvas'); cv.width = 48; cv.height = 48;
  const cx = cv.getContext('2d');
  ['A','B','C'].forEach(ch=>{
    cx.fillStyle = '#fff'; cx.fillRect(0,0,48,48);
    cx.fillStyle = '#000'; cx.font = '700 28px "Noto Sans KR",sans-serif';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(ch, 24, 24);
    const id = cx.getImageData(0,0,48,48).data;
    let x0=48,y0=48,x1=-1,y1=-1;
    for(let y=0;y<48;y++) for(let x=0;x<48;x++){
      if(id[(y*48+x)*4] < 160){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
    const vec = new Float32Array(W*H);
    const bw = Math.max(1, x1-x0+1), bh = Math.max(1, y1-y0+1);
    for(let ty=0;ty<H;ty++) for(let tx=0;tx<W;tx++){
      const sx = Math.min(47, Math.floor(x0 + (tx+0.5)*bw/W));
      const sy = Math.min(47, Math.floor(y0 + (ty+0.5)*bh/H));
      vec[ty*W+tx] = (255 - id[(sy*48+sx)*4]) / 255;
    }
    out[ch] = vec;
  });
  return out;
}
function matchCellChar(imgData, imgW, x0, y0, x1, y1, templates){
  const padX = Math.max(2, Math.round((x1-x0)*0.18)), padY = Math.max(2, Math.round((y1-y0)*0.18));
  const sx0 = x0+padX, sx1 = x1-padX, sy0 = y0+padY, sy1 = y1-padY;
  if(sx1<=sx0 || sy1<=sy0) return '';
  let bx0=sx1, by0=sy1, bx1=sx0, by1=sy0, count=0;
  for(let y=sy0;y<=sy1;y++) for(let x=sx0;x<=sx1;x++){
    const idx = (y*imgW+x)*4;
    const lum = 0.299*imgData[idx] + 0.587*imgData[idx+1] + 0.114*imgData[idx+2];
    if(lum < 145){ count++; if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y; }
  }
  if(count < 8 || (bx1-bx0)<2 || (by1-by0)<3) return '';
  const W = 16, H = 20, vec = new Float32Array(W*H);
  const bw = Math.max(1, bx1-bx0+1), bh = Math.max(1, by1-by0+1);
  for(let ty=0;ty<H;ty++) for(let tx=0;tx<W;tx++){
    const sx = Math.floor(bx0 + (tx+0.5)*bw/W);
    const sy = Math.floor(by0 + (ty+0.5)*bh/H);
    const idx = (sy*imgW+sx)*4;
    const lum = 0.299*imgData[idx] + 0.587*imgData[idx+1] + 0.114*imgData[idx+2];
    vec[ty*W+tx] = Math.max(0, (200 - lum)/200);
  }
  let best = '', bestScore = -1;
  ['A','B','C'].forEach(ch=>{
    const tpl = templates[ch];
    let dot=0, n1=0, n2=0;
    for(let i=0;i<vec.length;i++){ dot+=vec[i]*tpl[i]; n1+=vec[i]*vec[i]; n2+=tpl[i]*tpl[i]; }
    const sc = dot / (Math.sqrt(n1*n2) || 1);
    if(sc > bestScore){ bestScore = sc; best = ch; }
  });
  return bestScore > 0.35 ? best : '';
}
function detectSongFromCanvas(data, w, h){
  const palette = SONGS.map(s=>{
    const hex = s.light.replace('#','');
    return { id:s.id, r:parseInt(hex.slice(0,2),16), g:parseInt(hex.slice(2,4),16), b:parseInt(hex.slice(4,6),16), hits:0 };
  });
  for(let y=Math.floor(h*0.15); y<Math.floor(h*0.85); y+=4){
    for(let x=Math.floor(w*0.05); x<Math.floor(w*0.95); x+=4){
      const i = (y*w+x)*4, r=data[i], g=data[i+1], b=data[i+2];
      palette.forEach(p=>{
        if(Math.abs(r-p.r)<14 && Math.abs(g-p.g)<14 && Math.abs(b-p.b)<14) p.hits++;
      });
    }
  }
  palette.sort((a,b)=>b.hits-a.hits);
  return palette[0].hits > 50 ? palette[0].id : S.cur;
}
function detectMeasureBoxes(data, w, h){
  const isDark = (x,y) => { const i=(y*w+x)*4; return data[i]<85 && data[i+1]<85 && data[i+2]<85; };
  const rowBands = [];
  for(let y=Math.floor(h*0.12); y<Math.floor(h*0.95); y++){
    let darkRun = 0, maxRun = 0;
    for(let x=0; x<w; x+=2){ if(isDark(x,y)){ darkRun+=2; if(darkRun>maxRun) maxRun=darkRun; } else darkRun=0; }
    if(maxRun > w*0.12) rowBands.push(y);
  }
  const lines = [];
  rowBands.forEach(y=>{ if(!lines.length || y - lines[lines.length-1][1] > 3) lines.push([y,y]); else lines[lines.length-1][1]=y; });
  const pairs = [];
  for(let i=0; i<lines.length-1; i++){
    const y0 = lines[i][1], y1 = lines[i+1][0], dy = y1 - y0;
    if(dy >= h*0.020 && dy <= h*0.065){
      const ym = Math.round((y0+y1)/2);
      let inBox = false, bx0 = 0;
      const boxes = [];
      for(let x=0; x<w; x++){
        const topOk = isDark(x, lines[i][0]) || isDark(x, y0);
        const botOk = isDark(x, y1) || isDark(x, lines[i+1][1]);
        if(topOk && botOk){
          if(!inBox){ inBox=true; bx0=x; }
        } else {
          if(inBox && x - bx0 > w*0.12){ boxes.push([bx0, y0, x-1, y1]); }
          inBox = false;
        }
      }
      if(inBox && w - bx0 > w*0.12) boxes.push([bx0, y0, w-1, y1]);
      if(boxes.length >= 1 && boxes.length <= 4){ pairs.push(boxes); i++; }
    }
  }
  return pairs;
}
async function loadPdfFile(file){
  if(!file) return;
  toast('PDF를 분석하는 중이에요…');
  try{
    const buf = await file.arrayBuffer();
    const embedded = parseEmbeddedPdfData(buf);
    if(embedded && embedded.songId && embedded.st){
      if(SONGS.some(s=>s.id===embedded.songId)) S.cur = embedded.songId;
      S.songs[S.cur] = { cells: embedded.st.cells || {}, notes: embedded.st.notes || {}, info: embedded.info || {no:'', name:''} };
      if(embedded.info) S.info = { no: embedded.info.no||'', name: embedded.info.name||'' };
      save(); render();
      toast('저장된 PDF 데이터를 완벽하게 불러왔어요!');
      return;
    }
    if(!window.pdfjsLib){
      await loadScript(PDFJS);
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    }
    const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    const page = await pdf.getPage(1);
    const vp = page.getViewport({ scale: 3 });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const cx = cv.getContext('2d');
    await page.render({ canvasContext: cx, viewport: vp }).promise;
    const img = cx.getImageData(0, 0, cv.width, cv.height);
    const songId = detectSongFromCanvas(img.data, cv.width, cv.height);
    if(SONGS.some(s=>s.id===songId)) S.cur = songId;
    const song = curSong();
    const rowBoxes = detectMeasureBoxes(img.data, cv.width, cv.height);
    const templates = makeCharTemplates();
    const cells = {};
    let ri = 0, loaded = 0;
    song.secs.forEach(sec=>sec.rows.forEach(row=>{
      const boxes = rowBoxes[ri] || [];
      row.m.forEach((lb, k)=>{
        const b = boxes[k]; if(!b) return;
        const cw = (b[2] - b[0]) / 16;
        for(let p=0; p<16; p++){
          const cx0 = Math.round(b[0] + p*cw), cx1 = Math.round(b[0] + (p+1)*cw);
          const ch = matchCellChar(img.data, cv.width, cx0, b[1], cx1, b[3], templates);
          if(ch){ cells[ri+'.'+k+'.'+p] = ch; loaded++; }
        }
      });
      ri++;
    }));
    S.songs[S.cur] = { cells, notes:{}, info: infoOf(S.cur) };
    save(); render();
    toast(loaded ? 'PDF에서 '+loaded+'개 칸의 박자를 불러왔어요!' : 'PDF에서 박자 칸을 찾지 못했어요.');
  }catch(err){
    toast('PDF를 불러오지 못했어요: ' + (err && err.message ? err.message : '오류'));
  }
}

  if(!PL.playing && !PL.bar) return;
  PL.playing = false; PL.paused = false; if(PL.ctx && PL.ctx.state==='suspended') PL.ctx.resume();
  clearInterval(PL.timer); cancelAnimationFrame(PL.raf);
  if(PL.bar && PL.bar.parentNode) PL.bar.remove();
  PL.bar = null;
  if(PL.out){ const o = PL.out; PL.out = null; try{ o.gain.cancelScheduledValues(0); o.gain.value = 0; }catch(e){} setTimeout(()=>{ try{ o.disconnect(); }catch(e){} }, 100); }
  updatePlayUI();
}
function updatePlayUI(){
  const b = $('#btnPlay'); if(!b) return;
  const running = PL.playing && !PL.paused;
  b.innerHTML = running ? ICON.pause : ICON.play;
  b.setAttribute('aria-label', running ? '일시정지' : '재생'); b.title = (running ? '일시정지' : '재생') + ' (스페이스바)';
  const sg = SONGS.find(s=>s.id===S.cur);
  const seq = sg ? buildSeq(sg) : [];
  if(seq.length) $('#posM').max = Math.max.apply(null, seq.map(x=>x.num));
  $('#spdV').textContent = sg ? '♩ = '+Math.round(sg.tempo*PL.speed)+' ('+PL.speed.toFixed(2)+'x)' : '';
  updateSyncUI();
  updateAudioTimeUI();
}
$('#btnPlay').addEventListener('click', togglePlay);
$('#btnRestart').innerHTML = ICON.restart;
$('#btnRestart').addEventListener('click', restartPlay);
$('#posM').addEventListener('change', goMeasure);
$('#posM').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); goMeasure(); $('#posM').blur(); } });
$('#spd').addEventListener('input', e=>{
  PL.speed = (+e.target.value)/100;
  if(audMode()==='yt' && PL.yt && PL.ytReady){
    try{ PL.yt.setPlaybackRate(PL.speed); }catch(e){}
  }
  updatePlayUI();
});
$('#btnYt').addEventListener('click', ()=>{
  if(PL.playing) stopPlay();
  if(PL.preview){ PL.preview = false; pauseSource(); }
  PL.ytEnabled = !PL.ytEnabled;
  if(PL.ytEnabled) cueSongYT();
  updateSyncUI(); updateAudioTimeUI();
});
$('#btnYtWin').addEventListener('click', ()=>{ PL.ytVisible = !PL.ytVisible; updateSyncUI(); });
$('#btnYtHide').addEventListener('click', ()=>{ PL.ytVisible = false; updateSyncUI(); });
$('#btnLoadPdf').addEventListener('click', ()=>$('#pdfFile').click());
$('#pdfFile').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(f) loadPdfFile(f);
});
$('#btnAudPreview').addEventListener('click', ()=>{
  if(audMode()!=='yt') return;
  if(PL.playing) stopPlay();
  if(PL.preview){
    PL.preview = false; pauseSource();
  } else {
    PL.preview = true; playSource();
    clearInterval(PL.ytPoll);
    PL.ytPoll = setInterval(()=>{ if(PL.preview) updateAudioTimeUI(); }, 200);
  }
  updateSyncUI();
});
$('#audSeek').addEventListener('pointerdown', ()=>{ PL.seeking = true; });
$('#audSeek').addEventListener('pointerup', ()=>{ PL.seeking = false; });
$('#audSeek').addEventListener('input', e=>{
  const val = +e.target.value;
  if(audMode()==='yt' && PL.yt && PL.ytReady){
    try{ PL.yt.seekTo(val, true); PL.ytLastRaw = val; PL.ytLastPerf = performance.now(); }catch(e){}
  } else return;
  if(PL.playing){
    const baseStep = 60/curSong().tempo/4, offset = getSync(S.cur);
    PL.scheduledIdx = Math.max(0, Math.floor((val - offset)/baseStep));
  }
  updateAudioTimeUI();
});
$('#audVol').addEventListener('input', e=>{
  PL.ytVol = +e.target.value;
  if(PL.yt && PL.ytReady) try{ PL.yt.setVolume(PL.ytVol); }catch(e){}
});
$('#btnMet').addEventListener('click', ()=>{ PL.metOn = !PL.metOn; updateSyncUI(); });
$('#syncSec').addEventListener('change', e=>{ setSync(S.cur, parseFloat(e.target.value)||0); });
$('#btnSyncMinus').addEventListener('click', ()=>{ setSync(S.cur, getSync(S.cur) - 0.05); });
$('#btnSyncPlus').addEventListener('click', ()=>{ setSync(S.cur, getSync(S.cur) + 0.05); });
$('#btnSyncNow').addEventListener('click', ()=>{
  if(audMode()==='none') return;
  setSync(S.cur, getSourceTime());
  toast('1마디 시작 위치를 '+getSync(S.cur).toFixed(2)+'초로 맞췄어요.');
});
document.addEventListener('keydown', e=>{
  if(e.code!=='Space' && e.key!==' ') return;
  if(!SESSION || !$('#dlg').hidden) return;
  const t = e.target, tag = t && t.tagName;
  if(tag==='BUTTON' || tag==='A' || tag==='TEXTAREA') return;
  if(tag==='INPUT' && !(t.classList.contains('c') || t.type==='range')) return;   /* 메모·학번·이름 칸에서는 띄어쓰기 */
  e.preventDefault(); togglePlay();
});
function resetSpeed(){
  PL.speed = 1; $('#spd').value = 100;
  if(PL.yt && PL.ytReady) try{ PL.yt.setPlaybackRate(1); }catch(e){}
}

$('#btnClear').addEventListener('click', async ()=>{
  const yes = await ask({title:'초기화 하시겠습니까?', chip:'', msg:'', ok:'확인'});
  if(!yes) return;
  S.songs[S.cur] = {cells:{}, notes:{}, info:{no:'', name:''}}; render();
  await ask({title:'초기화되었습니다.', chip:'', msg:'', ok:'확인', single:true});
});
$('#btnSave').addEventListener('click', async ()=>{
  const yes = await ask({title:'저장하시겠습니까?', chip:'', msg:'', ok:'확인'});
  if(!yes) return;
  const ok = commitSave();
  await ask({title: ok ? '저장되었습니다.' : '저장하지 못했어요.', chip:'', msg: ok ? '' : '이 브라우저에서는 저장이 되지 않아요. "PDF 다운로드"으로 제출해 주세요.', ok:'확인', single:true});
  renderFoot();
});
[3,4].forEach(n=>{
  $('#sub'+n).textContent = SONGS_ALL.filter(s=>!(SESSION_HIDDEN[n]||[]).includes(s.id)).map(s=>s.title).join(' / ');
});
$$('.home-btn').forEach(b=>b.addEventListener('click', ()=>{ setSession(+b.dataset.session); render(); window.scrollTo(0,0); }));
$('#btnHome').addEventListener('click', ()=>{ revertToSaved(); S.zm = 1; resetSpeed(); SESSION = 0; render(); window.scrollTo(0,0); });   /* 저장하지 않은 내용은 홈으로 가면 사라짐 */
$('#btnPrintMode').addEventListener('click', ()=>doPrint('filled'));
$('#btnPrint').addEventListener('click', savePdf);
$('#zIn').addEventListener('click', ()=>setZoom(S.zm + 0.1));
$('#zOut').addEventListener('click', ()=>setZoom(S.zm - 0.1));
$('#zW').addEventListener('click', ()=>setZoom(fitWidthZoom()));
$('#zFit').addEventListener('click', ()=>setZoom(1));
window.addEventListener('resize', fit);

render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ refScale=0; render(); });
})();
</script>
</body>
</html>
